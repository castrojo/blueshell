app-id: com.mitchellh.ghostty-debug
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
default-branch: tip
command: ghostty
rename-icon: com.mitchellh.ghostty
finish-args:
  # 3D rendering
  - --device=dri
  # use host PTS namespace
  - --device=all
  # Windowing
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Read the host's ~/.config/ghostty (config, themes) and any config-file
  # includes in $HOME. Flatpak redirects XDG_CONFIG_HOME into
  # ~/.var/app/<id>/config, so src/config/flatpak_host.zig loads the host
  # config as a base layer; the sandbox-local config overrides it.
  - --filesystem=home:ro
  # So we can escape the sandbox
  - --talk-name=org.freedesktop.Flatpak
cleanup:
  - /include
  - /lib/girepository-1.0
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/pkgconfig
  - /share/vala
  - "*.la"
  - "*.a"
  - "*.so"

modules:
  - dependencies.yml

  - name: ghostty
    buildsystem: simple
    build-options:
      append-path: /app/zig
    build-commands:
      - zig build
        -Doptimize=Debug
        -Dcpu=baseline
        -Dflatpak=true
        -Dstrip=false
        -fno-sys=oniguruma
        --prefix /app
        --search-prefix /app
        --system $PWD/vendor/p
    sources:
      - type: dir
        path: ..
        skip:
          - flatpak/.flatpak-builder
          - flatpak/builddir
          - flatpak/repo
          - zig-cache
          - zig-out

      - zig-packages.json
